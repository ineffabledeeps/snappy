<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snappy</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        max-width: 42rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.5;
        color: #111;
      }
      code {
        background: #f4f4f5;
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 1rem;
        border-radius: 8px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Snappy</h1>
    <p>Full-page screenshot API. Send a URL or HTML; get a PNG of the full scrolled page.</p>
    <p>POST <code>/api</code></p>
    <pre>{
  "url": "https://example.com",
  "device": "iPhone 14",
  "response": "url"
}</pre>
  </body>
</html>
